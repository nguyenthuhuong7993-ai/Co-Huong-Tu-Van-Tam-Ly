           CÀI ĐẶT CHUNG
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:

                Arial,
                sans-serif;

                    135deg,
                    #eeeaff,
                    #f8f7ff

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* =====================================================
           KHUNG CHATBOT
           ===================================================== */

        .chat-container {

            width: 100%;

            max-width: 560px;

            height: 720px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 10px 40px
                rgba(80, 60, 160, 0.18);

        }


        /* =====================================================
           HEADER
           ===================================================== */

        .chat-header {

            min-height: 82px;

            background:
                linear-gradient(
                    135deg,
                    #6545e8,
                    #7939d8
                );

            color: white;

            display: flex;

            align-items: center;

            padding: 15px 20px;

        }


        .header-avatar {

            width: 48px;

            height: 48px;

            min-width: 48px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.22);

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 25px;

            margin-right: 12px;

        }


        .header-info {

            flex: 1;

        }


        .header-name {

            font-size: 17px;

            font-weight: 700;

        }


        .header-role {

            font-size: 11px;

            opacity: 0.9;

            margin-top: 3px;

        }


        .status {

            font-size: 11px;

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .status-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #6df6a0;

        }


        /* =====================================================
           KHUNG TIN NHẮN
           ===================================================== */

        .chat-messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px 15px;

            background: #fafbff;

            scroll-behavior: smooth;

        }


        .message {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin-bottom: 18px;

        }


        .user-message {

            flex-direction: row-reverse;

        }


        .msg-avatar {

            width: 36px;

            height: 36px;

            min-width: 36px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 17px;

        }


        .bot-message .msg-avatar {

            background: #eeeaff;

        }


        .user-message .msg-avatar {

            background: #e9e9e9;

        }


        .msg-content {

            max-width: 80%;

            padding: 12px 15px;

            font-size: 14px;

            line-height: 1.6;

            border-radius: 18px;

            word-wrap: break-word;

        }


        .bot-message .msg-content {

            background: white;

            border: 1px solid #e5e4f5;

            color: #27272a;

            border-bottom-left-radius: 5px;

        }


        .user-message .msg-content {

            background: #6845e8;

            color: white;

            border-bottom-right-radius: 5px;

           THÔNG TIN GIÁO VIÊN
           ===================================================== */

            font-weight: 700;

           HIỆU ỨNG ĐANG SUY NGHĨ
           ===================================================== */

            color: #999;

            font-style: italic;

        }


        /* =====================================================
           NÚT GỢI Ý
           ===================================================== */

            display: flex;

            gap: 8px;

            padding: 11px 12px;

            background: white;

            border-top: 1px solid #eeeeee;

            overflow-x: auto;

        }

            flex: 0 0 auto;

            border: 1px solid #dedede;

            background: #f6f6f8;

            color: #333;

            padding: 9px 14px;

            border-radius: 22px;

            font-size: 12px;

            cursor: pointer;

            transition: all 0.2s;

            background: #e9e2ff;

            border-color: #8168e9;

            color: #5131c5;

        }

           KHU VỰC NHẬP

           FOOTER

           ===================================================== */

</head>

function normalizeText(text) {

    return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(
            /[.,!?;:()[\]{}"'`]/g,
            " "
        )
        .replace(/\s+/g, " ")
        .trim();

}

            "Em hãy thử nghĩ đến một người mà em cảm thấy an toàn khi nói chuyện: cha mẹ, thầy cô, anh chị hoặc một người bạn đáng tin cậy."

    },


    /* -------------------------------------------------------
       TÌNH CẢM
       ------------------------------------------------------- */

    {

        ],

            "Khi thích một người, mình có thể vui, hồi hộp hoặc lo lắng. Em đang gặp điều gì khiến em khó xử?",

            "Nếu em vừa trải qua chuyện chia tay hoặc thất vọng, hãy cho bản thân thời gian để bình tĩnh và chăm sóc chính mình nhé 💜"

        ]

    },


    /* -------------------------------------------------------
       MẤT NGỦ
       ------------------------------------------------------- */

    {

        keywords: [

            "mat ngu",
            "khong ngu",
            "kho ngu",
            "ngu khong du",
            "thuc dem"

        ],

        answers: [

            "Nếu gần đây em thường xuyên khó ngủ, em hãy thử duy trì giờ ngủ đều đặn và hạn chế sử dụng điện thoại trước khi ngủ 🌙",

            "Cô muốn biết thêm: em khó ngủ vì học tập, lo lắng, chuyện gia đình hay một nguyên nhân khác?"

        ]

    },


    /* -------------------------------------------------------
       LIÊN HỆ
       ------------------------------------------------------- */

    {

        keywords: [

            "lien he",
            "so dien thoai",
            "sdt",
            "dien thoai",
            "co o dau",
            "tim co",
            "gap co",
            "lien lac"

        ],

        answers: [

            "Đây là thông tin để em có thể liên hệ trực tiếp với cô khi cần hỗ trợ nhé 💜"

        ]

    }

];



/* ==========================================================
   6. TỪ KHÓA AN TOÀN
   ========================================================== */

const safetyKeywords = [

    "tu tu",

    "tu sat",

    "muon chet",

    "muon tu tu",

    "khong muon song",

    "muon bien mat",

    "lam hai ban than",

    "tu lam hai",

    "lam dau ban than",

    "bi danh",

    "bi bao hanh",

    "bi de doa",

    "nguy hiem",

    "co nguoi danh",

    "co nguoi de doa"

];



/* ==========================================================
   7. KIỂM TRA AN TOÀN
   ========================================================== */

function checkSafety(text) {

    const normalized =
        normalizeText(text);


    for (
        const keyword of safetyKeywords
    ) {

        if (
            normalized.includes(
                normalizeText(keyword)
            )
        ) {

            return `

                <strong>
                    💜 Cô rất quan tâm đến sự an toàn của em.
                </strong>

                <br><br>

                Nếu em đang gặp nguy hiểm hoặc có ý nghĩ
                làm hại bản thân, em hãy tìm ngay một người
                lớn đáng tin cậy ở bên cạnh mình.

                <br><br>

                👩‍🏫 Em có thể liên hệ với cô Hường:
                <strong>${INFO.phone}</strong>

                <br><br>

                Nếu có nguy hiểm ngay lập tức,
                hãy nhờ người lớn hỗ trợ và đến cơ sở y tế
                phù hợp.

                <br><br>

                <strong>
                    Em không cần phải đối mặt với chuyện này
                    một mình. 💜
                </strong>

            `;

        }

    }


    return null;

}



/* ==========================================================
   8. TÌM CÂU TRẢ LỜI
   ========================================================== */

function getAnswer(text) {


    const normalized =
        normalizeText(text);


    /* -------------------------------------------------------
       KIỂM TRA AN TOÀN TRƯỚC
       ------------------------------------------------------- */

    const safety =
        checkSafety(text);


    if (safety) {

        return (
            safety +
            teacherContact()
        );

    }



    /* -------------------------------------------------------
       TÌM CHỦ ĐỀ PHÙ HỢP
       ------------------------------------------------------- */

    let bestTopic = null;

    let bestScore = 0;


    for (
        const topic of knowledge
    ) {

        let score = 0;


        for (
            const keyword of topic.keywords
        ) {

            const key =
                normalizeText(keyword);


            if (
                normalized.includes(key)
            ) {

                /*
                   Từ khóa càng dài
                   thì điểm càng cao
                */

                score += key.length;

            }

        }


        if (
            score > bestScore
        ) {

            bestScore = score;

            bestTopic = topic;

        }

    }



    /* -------------------------------------------------------
       CÓ CHỦ ĐỀ PHÙ HỢP
       ------------------------------------------------------- */

    if (bestTopic) {


        const answers =
            bestTopic.answers;


        const answer =
            answers[
                Math.floor(
                    Math.random() *
                    answers.length
                )
            ];


        /*
           Nếu học sinh hỏi thông tin liên hệ
           thì trả về khung liên hệ.
        */

        const contactQuestion =
            normalized.includes("lien he") ||
            normalized.includes("so dien thoai") ||
            normalized.includes("sdt") ||
            normalized.includes("dien thoai") ||
            normalized.includes("gap co");


        if (contactQuestion) {

            return (
                answer +
                teacherContact()
            );

        }


        /*
           Các cuộc trò chuyện bình thường
           cũng hiển thị thông tin giáo viên.
        */

        return (
            answer +
            teacherContact()
        );

    }



    /* -------------------------------------------------------
       KHÔNG TÌM THẤY CHỦ ĐỀ
       ------------------------------------------------------- */

    return `

        Cô đang lắng nghe em 💜

        <br><br>

        Em có thể nói rõ hơn một chút về điều đang khiến em
        suy nghĩ hoặc lo lắng không?

        <br><br>

        Em có thể bắt đầu bằng:

        <br>

        • "Em đang buồn vì..."

        <br>

        • "Em đang lo vì..."

        <br>

        • "Em gặp vấn đề với bạn..."

        <br>

        • "Em đang gặp khó khăn trong học tập..."

        ${teacherContact()}

    `;

}



/* ==========================================================
   9. HIỂN THỊ TIN NHẮN
   ========================================================== */

function addMessage(
    content,
    isUser
) {


    const message =
        document.createElement("div");


    message.className =
        isUser
        ? "message user-message"
        : "message bot-message";



    const avatar =
        document.createElement("div");


    avatar.className =
        "msg-avatar";


    avatar.textContent =
        isUser
        ? "👤"
        : "👩‍🏫";



    const contentBox =
        document.createElement("div");


    contentBox.className =
        "msg-content";



    if (isUser) {

        /*
           Tin của học sinh
           không cho phép HTML
        */

        contentBox.textContent =
            content;

    } else {

        /*
           Tin của chatbot
           cho phép HTML để hiển thị
           khung thông tin giáo viên
        */

        contentBox.innerHTML =
            content;

    }



    message.appendChild(
        avatar
    );


    message.appendChild(
        contentBox
    );


    chatMessages.appendChild(
        message
    );


    /*
       Tự động cuộn xuống cuối
    */

    setTimeout(
        function () {

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

        },
        50
    );

}



/* ==========================================================
   10. HIỂN THỊ "ĐANG SUY NGHĨ"
   ========================================================== */

function showTyping() {


    removeTyping();


    const message =
        document.createElement("div");


    message.id =
        "typingMessage";


    message.className =
        "message bot-message";


    message.innerHTML = `

        <div class="msg-avatar">
            👩‍🏫
        </div>

        <div class="msg-content typing">
            Cô đang suy nghĩ... 💭
        </div>

    `;


    chatMessages.appendChild(
        message
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}



/* ==========================================================
   11. XÓA "ĐANG SUY NGHĨ"
   ========================================================== */

function removeTyping() {


    const typing =
        document.getElementById(
            "typingMessage"
        );


    if (typing) {

        typing.remove();

    }

}



/* ==========================================================
   12. GỬI TIN NHẮN
   ========================================================== */

function sendMessage(text) {


    const message =
        String(text || "").trim();


    /*
       Nếu không có nội dung
    */

    if (!message) {

        messageInput.focus();

        return;

    }



    /*
       Hiển thị tin nhắn học sinh
    */

    addMessage(
        message,
        true
    );



    /*
       Xóa ô nhập
    */

    messageInput.value = "";



    /*
       Hiển thị đang suy nghĩ
    */

    showTyping();



    /*
       Khóa nút gửi
       trong thời gian chatbot trả lời
    */

    sendButton.disabled =
        true;



    /*
       Chatbot trả lời
       sau 0,7 giây
    */

    setTimeout(
        function () {


            removeTyping();


            const answer =
                getAnswer(message);


            addMessage(
                answer,
                false
            );


            sendButton.disabled =
                false;


            messageInput.focus();


        },
        700
    );

}



/* ==========================================================
   13. NÚT GỬI
   ========================================================== */

sendButton.addEventListener(
    "click",
    function () {

        sendMessage(
            messageInput.value
        );

    }
);



/* ==========================================================
   14. NHẤN ENTER ĐỂ GỬI
   ========================================================== */

messageInput.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key === "Enter"
        ) {


            event.preventDefault();


            sendMessage(
                messageInput.value
            );

        }

    }
);



/* ==========================================================
   15. CÁC NÚT GỢI Ý
   ========================================================== */

quickButtons.forEach(
    function (button) {


        button.addEventListener(
            "click",
            function () {


                const message =
                    button.getAttribute(
                        "data-message"
                    );


                sendMessage(
                    message
                );

            }
        );

    }
);



/* ==========================================================
   16. LỜI CHÀO BAN ĐẦU
   ========================================================== */

addMessage(

    `

        <strong>
            Chào em! 🌸
        </strong>

        <br><br>

        Cô Hường rất vui được trò chuyện cùng em!

        <br>

        Nếu em có bất kỳ khó khăn,
        lo lắng trong học tập,
        bạn bè, gia đình hay cảm xúc,
        hãy chia sẻ với cô nhé 💜

        ${teacherContact()}

    `,

    false

);



/* ==========================================================
   17. ĐẶT CON TRỎ VÀO Ô NHẬP
   ========================================================== */

messageInput.focus();
