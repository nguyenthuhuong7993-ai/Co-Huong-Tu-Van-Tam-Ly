<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cô Hường - Tư vấn tâm lý học đường</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Segoe UI",sans-serif;
    background:#f0eefc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.chat-container{
    width:100%;
    max-width:540px;
    height:680px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(80,60,160,.18);
    display:flex;
    flex-direction:column;
}

/* HEADER */

.chat-header{
    height:78px;
    background:linear-gradient(135deg,#6545e8,#7939d8);
    color:white;
    display:flex;
    align-items:center;
    padding:15px 20px;
}

.header-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    margin-right:12px;
}

.header-info{
    flex:1;
}

.header-name{
    font-size:16px;
    font-weight:bold;
}

.header-role{
    font-size:11px;
    opacity:.9;
    margin-top:3px;
}

.status{
    font-size:11px;
    display:flex;
    align-items:center;
    gap:5px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#65f59a;
}

/* CHAT */

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:20px 15px;
    background:#fafbff;
}

.message{
    display:flex;
    margin-bottom:16px;
    align-items:flex-start;
    gap:8px;
}

.user-message{
    flex-direction:row-reverse;
}

.msg-avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
}

.bot-message .msg-avatar{
    background:#eeeaff;
}

.user-message .msg-avatar{
    background:#e7e7e7;
}

.msg-content{
    max-width:78%;
    padding:11px 14px;
    font-size:14px;
    line-height:1.55;
    border-radius:17px;
    word-wrap:break-word;
}

.bot-message .msg-content{
    background:white;
    border:1px solid #e5e5f5;
    color:#252525;
    border-bottom-left-radius:5px;
}

.user-message .msg-content{
    background:#6745e8;
    color:white;
    border-bottom-right-radius:5px;
}

/* GỢI Ý */

.quick-replies{
    display:flex;
    gap:7px;
    padding:10px 12px;
    background:white;
    border-top:1px solid #eeeeee;
    overflow-x:auto;
}

.quick-btn{
    flex:0 0 auto;
    border:1px solid #e2e2e2;
    background:#f5f5f7;
    color:#333;
    padding:9px 13px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.quick-btn:hover{
    background:#e7e1ff;
    border-color:#8a70ed;
}

.quick-btn:active{
    transform:scale(.96);
}

/* NHẬP */

.input-area{
    display:flex;
    gap:8px;
    padding:12px;
    background:white;
    border-top:1px solid #eeeeee;
}

.message-input{
    flex:1;
    height:44px;
    border:1px solid #ddd;
    border-radius:24px;
    outline:none;
    padding:0 17px;
    font-size:14px;
}

.message-input:focus{
    border-color:#7656e8;
}

.send-button{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#6845e8;
    color:white;
    cursor:pointer;
    font-size:18px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.send-button:hover{
    background:#5131cf;
}

.send-button:active{
    transform:scale(.94);
}

/* FOOTER */

.footer{
    text-align:center;
    font-size:10px;
    color:#999;
    padding:7px;
    background:white;
}

/* ĐANG SUY NGHĨ */

.typing{
    color:#999;
    font-style:italic;
}

@media(max-width:600px){

    body{
        padding:0;
    }

    .chat-container{
        width:100%;
        height:100vh;
        border-radius:0;
    }

    .msg-content{
        max-width:82%;
    }

}

</style>

function normalizeText(text){

    return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/đ/g,"d")
        .replace(/[.,!?;:()[\]{}"'`]/g," ")
        .replace(/\s+/g," ")
        .trim();

}

/* ----------------------------------------------------------
   TỪ KHÓA AN TOÀN
   ---------------------------------------------------------- */

const safetyKeywords = [

    "tu tu",
    "tu sat",
    "muon chet",
    "khong muon song",
    "lam hai ban than",
    "tu lam hai",
    "lam dau ban than",
    "bi danh",
    "bi bao hanh",
    "bi de doa",
    "nguy hiem"

];


/* ----------------------------------------------------------
   KIỂM TRA AN TOÀN
   ---------------------------------------------------------- */

function checkSafety(text){

    const normalized =
        normalizeText(text);


    for(const keyword of safetyKeywords){

        if(
            normalized.includes(
                normalizeText(keyword)
            )
        ){

            return `
            <strong>💜 Cô rất quan tâm đến sự an toàn của em.</strong>
            <br><br>
            Nếu em đang gặp nguy hiểm hoặc có ý nghĩ làm hại bản thân,
            em hãy tìm ngay một người lớn đáng tin cậy ở bên cạnh mình.
            <br><br>
            👩‍🏫 Em có thể liên hệ với cô Hường:
            <strong>${INFO.phone}</strong>
            <br><br>
            Nếu có nguy hiểm ngay lập tức,
            hãy nhờ người lớn hỗ trợ và đến cơ sở y tế phù hợp.
            <br><br>
            <strong>Em không cần phải đối mặt với chuyện này một mình. 💜</strong>
            `;
        }

    }

    return null;

}


/* ----------------------------------------------------------
   TÌM CÂU TRẢ LỜI
   ---------------------------------------------------------- */

function getAnswer(text){

    const normalized =
        normalizeText(text);


    const safety =
        checkSafety(text);


    if(safety){

        return safety;

    }


    let bestTopic = null;

    let bestScore = 0;


    for(const topic of knowledge){

        let score = 0;


        for(const keyword of topic.keywords){

            const key =
                normalizeText(keyword);


            if(
                normalized.includes(key)
            ){

                score += key.length;

            }

        }


        if(score > bestScore){

            bestScore = score;

            bestTopic = topic;

        }

    }


    if(bestTopic){

        const answers =
            bestTopic.answers;


        return answers[
            Math.floor(
                Math.random() * answers.length
            )
        ];

    }


    return `
    Cô đang lắng nghe em 💜
    <br><br>
    Em có thể nói rõ hơn một chút về điều đang khiến em
    suy nghĩ hoặc lo lắng không?
    <br><br>
    Em có thể bắt đầu bằng:
    <br>
    • "Em đang buồn vì..."
    <br>
    • "Em đang lo vì..."
    <br>
    • "Em gặp vấn đề với bạn..."
    <br>
    • "Em đang gặp khó khăn trong học tập..."
    `;

}


/* ----------------------------------------------------------
   HIỂN THỊ TIN NHẮN
   ---------------------------------------------------------- */

function addMessage(text,isUser){

    const message =
        document.createElement("div");


    message.className =
        isUser
        ? "message user-message"
        : "message bot-message";


    const avatar =
        document.createElement("div");


    avatar.className =
        "msg-avatar";


    avatar.textContent =
        isUser ? "👤" : "👩‍🏫";


    const content =
        document.createElement("div");


    content.className =
        "msg-content";


    if(isUser){

        content.textContent = text;

    }else{

        content.innerHTML = text;

    }


    message.appendChild(avatar);

    message.appendChild(content);

    chatMessages.appendChild(message);


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


/* ----------------------------------------------------------
   ĐANG SUY NGHĨ
   ---------------------------------------------------------- */

function showTyping(){

    const message =
        document.createElement("div");


    message.id =
        "typingMessage";


    message.className =
        "message bot-message";


    message.innerHTML = `
        <div class="msg-avatar">👩‍🏫</div>
        <div class="msg-content typing">
            Cô đang suy nghĩ... 💭
        </div>
    `;


    chatMessages.appendChild(message);


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


function hideTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );


    if(typing){

        typing.remove();

    }

}


/* ----------------------------------------------------------
   GỬI TIN NHẮN
   ---------------------------------------------------------- */

function sendMessage(text){

    const message =
        String(text || "").trim();


    if(!message){

        messageInput.focus();

        return;

    }


    addMessage(
        message,
        true
    );


    messageInput.value = "";


    showTyping();


    sendButton.disabled = true;


    setTimeout(function(){

        hideTyping();


        const answer =
            getAnswer(message);


        addMessage(
            answer,
            false
        );


        sendButton.disabled = false;


        messageInput.focus();

    },600);

}


/* ----------------------------------------------------------
   NÚT GỬI
   ---------------------------------------------------------- */

sendButton.addEventListener(
    "click",
    function(){

        sendMessage(
            messageInput.value
        );

    }
);


/* ----------------------------------------------------------
   NHẤN ENTER
   ---------------------------------------------------------- */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage(
                messageInput.value
            );

        }

    }
);


/* ----------------------------------------------------------
   CÁC NÚT GỢI Ý
   ---------------------------------------------------------- */

quickButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const text =
                    button.getAttribute(
                        "data-message"
                    );


                sendMessage(text);

            }
        );

    }
);


/* ----------------------------------------------------------
   LỜI CHÀO BAN ĐẦU
   ---------------------------------------------------------- */

addMessage(

    <br>

    bạn bè, gia đình hoặc cảm xúc,

/* ----------------------------------------------------------
